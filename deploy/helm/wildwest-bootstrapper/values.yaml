nameOverride: ""
fullnameOverride: ""

# Optional label selector; only Secrets matching it will be reconciled.
# Empty string means all Secrets are reconciled.
# Example: "wildwest.dev/bootstrap=true"
secretLabelSelector: ""

# Key in the Secret data that holds the kubeconfig to bootstrap into.
kubeconfigKey: kubeconfig

replicas: 1

image:
  repository: ghcr.io/platform-mesh/wildwest-bootstrapper
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

leaderElection:
  enabled: true
  id: wildwest-bootstrapper

ports:
  metrics: 9080
  probes: 8080

extraArgs: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

nodeSelector: {}
affinity: {}
tolerations: []
