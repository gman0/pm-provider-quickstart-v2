{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "wildwest-controller.fullname" . }}
  labels:
    {{- include "wildwest-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["wildwest.dev"]
    resources: ["cowboys"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["wildwest.dev"]
    resources: ["cowboys/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "wildwest-controller.fullname" . }}
  labels:
    {{- include "wildwest-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "wildwest-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "wildwest-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Permissions for api-syncagent instances deployed into this chart's
# namespace: full CRUD on the published kinds so each agent can sync
# objects down from its kcp. Binds to the virtual group of every
# ServiceAccount in this namespace, so new agents inherit perms
# automatically with no RBAC churn.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "wildwest-controller.fullname" . }}-syncagent
  labels:
    {{- include "wildwest-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["wildwest.dev"]
    resources: ["cowboys"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["wildwest.dev"]
    resources: ["cowboys/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "wildwest-controller.fullname" . }}-syncagent
  labels:
    {{- include "wildwest-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "wildwest-controller.fullname" . }}-syncagent
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:{{ .Release.Namespace }}
{{- if .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "wildwest-controller.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wildwest-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "wildwest-controller.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wildwest-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "wildwest-controller.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "wildwest-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
