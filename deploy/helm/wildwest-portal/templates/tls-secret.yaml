{{- if .Values.tls.createSecret -}}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ .Values.tls.secretName | default (printf "%s-tls" (include "wildwest-portal.fullname" .)) }}
  labels:
    {{- include "wildwest-portal.labels" . | nindent 4 }}
data:
  tls.crt: {{ .Files.Get "pki/tls.crt" | b64enc | quote }}
  tls.key: {{ .Files.Get "pki/tls.key" | b64enc | quote }}
  ca.crt:  {{ .Files.Get "pki/ca.crt"  | b64enc | quote }}
{{- end }}
