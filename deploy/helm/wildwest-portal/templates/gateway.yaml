{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "wildwest-portal.fullname" . }}
  labels:
    {{- include "wildwest-portal.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ required "gateway.className is required" .Values.gateway.className }}
  listeners:
    - name: https
      protocol: HTTPS
      port: {{ .Values.gateway.port }}
      hostname: {{ .Values.gateway.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.tls.secretName | default (printf "%s-tls" (include "wildwest-portal.fullname" .)) }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
