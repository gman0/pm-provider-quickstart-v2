{{- if and .Values.httpRoute.enabled .Values.httpRoute.referenceGrant.enabled -}}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "wildwest-portal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wildwest-portal.labels" . | nindent 4 }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ required "httpRoute.referenceGrant.fromNamespace is required when httpRoute.referenceGrant.enabled is true" .Values.httpRoute.referenceGrant.fromNamespace }}
  to:
    - group: ""
      kind: Service
      name: {{ include "wildwest-portal.fullname" . }}
{{- end }}
