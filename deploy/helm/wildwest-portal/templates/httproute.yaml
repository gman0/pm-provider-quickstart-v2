{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "wildwest-portal.fullname" . }}
  labels:
    {{- include "wildwest-portal.labels" . | nindent 4 }}
spec:
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "wildwest-portal.fullname" . }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ include "wildwest-portal.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
