replicaCount: 1

# External URL the portal is reachable at. Informational — consumed by
# whoever wires this value into a ContentConfiguration or similar.
# Derived from gateway.hostname + gateway.port by default. HTTP only —
# this chart is a dev example; put a real cert in front of it for real use.
externalURL: "http://wildwest.127-0-0-1.sslip.io:32000"

image:
  repository: ghcr.io/platform-mesh/provider-quickstart-v2-portal
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 101

service:
  type: ClusterIP
  port: 8080
  # Only honored when type=NodePort. Leave empty to let kube-apiserver pick.
  nodePort: ""

# Optional Gateway API HTTPRoute attaching the portal Service to an
# existing cluster Gateway. Users supply the Gateway themselves
# (shared or dedicated). HTTPRoute lives in the release namespace by
# default; override via httpRoute.namespace to co-locate with the Gateway.
httpRoute:
  enabled: false
  # -- Namespace for the HTTPRoute. Defaults to the release namespace.
  namespace: ""
  # -- Hostnames the route matches. Leave empty to match any host on
  # the selected Gateway listener.
  hostnames: []
  # -- Gateways the route attaches to.
  parentRefs: []
  # - group: gateway.networking.k8s.io
  #   kind: Gateway
  #   name: shared
  #   namespace: platform-mesh-system
  # -- Path prefix matched by the route. The portal image is built with
  # `baseHref: /cowboys/`, so /cowboys is the natural default.
  pathPrefix: /cowboys
  # -- Optional filters (e.g. URLRewrite, RequestHeaderModifier).
  filters: []
  # -- Optional ReferenceGrant permitting an HTTPRoute from another
  # namespace to backendRef this chart's Service.
  referenceGrant:
    enabled: false
    fromNamespace: ""

# Optional classic Ingress, for clusters without Gateway API. Same-ns only.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: portal.example.com
  #   paths:
  #     - path: /cowboys
  #       pathType: Prefix
  tls: []
  # - hosts:
  #     - portal.example.com
  #   secretName: portal-tls

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
