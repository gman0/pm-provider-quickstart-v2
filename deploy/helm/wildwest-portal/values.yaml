replicaCount: 1

# External URL the portal is reachable at. Informational — consumed by
# whoever wires this value into a ContentConfiguration or similar.
# Derived from gateway.hostname + gateway.port by default.
externalURL: "https://wildwest.127-0-0-1.sslip.io:32000"

image:
  repository: ghcr.io/platform-mesh/provider-quickstart-portal
  pullPolicy: IfNotPresent
  tag: "@sha256:9cd97331681e777c1ba928b66dc4e088b9ca86816c241c90c353fd07dbf107b6"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 101

service:
  type: ClusterIP
  port: 8080

# A dedicated Gateway (+ HTTPRoute) terminating TLS for the portal.
# The gateway controller (whichever implements gateway.className) must publish
# the listener on the provider cluster so port is reachable externally — on a
# kind setup that typically means configuring the controller's backing Service
# as a NodePort bound to .gateway.port.
gateway:
  enabled: true
  className: envoy
  hostname: wildwest.127-0-0-1.sslip.io
  port: 32000

# Static TLS material lives under ./pki (committed in-repo). The Secret is
# synthesized from those files at render time. Set createSecret=false to
# bring your own externally managed Secret.
tls:
  createSecret: true
  # Leave empty to default to "<fullname>-tls".
  secretName: ""

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
