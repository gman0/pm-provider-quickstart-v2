                    "version": "v1alpha1",
                    "entity": "Cowboy",
                    "entityCollection": "Cowboys",
                    "scope": "Cluster",
                    "namespace": null,
                    "readyCondition": {
                      "jsonPathExpression": "status.result",
                      "property": ["status.result"]
                    },
                    "ui": {
                      "listView": {
                        "fields": [
                          { "label": "Name",   "property": "metadata.name" },
                          { "label": "Intent", "property": "spec.intent" },
                          { "label": "Result", "property": "status.result" }
                        ]
                      },
                      "detailView": {
                        "fields": [
                          { "label": "Name",   "property": "metadata.name" },
                          { "label": "Intent", "property": "spec.intent" },
                          { "label": "Result", "property": "status.result" }
                        ]
                      },
                      "createView": {
                        "fields": [
                          { "label": "Name",   "property": "metadata.name", "required": true },
                          { "label": "Intent", "property": "spec.intent",   "required": true }
                        ]
                      }
                    }
                  }
                },
                "children": [
                  {
                    "pathSegment": ":resourceId",
                    "hideFromNav": true,
                    "keepSelectedForChildren": false,
                    "defineEntity": {
                      "id": "wildwest_dev_cowboy",
                      "contextKey": "resourceId",
                      "graphqlEntity": {
                        "group": "wildwest_dev",
                        "version": "v1alpha1",
                        "kind": "Cowboy",
                        "query": "{ metadata { name } }"
                      }
                    },
                    "context": { "accountId": ":accountId", "resourceId": ":resourceId" }
                  }
                ]
              },
              {
                "entityType": "main.core_platform-mesh_io_account.wildwest_dev_cowboy",
                "pathSegment": "dashboard",
                "label": "Overview",
                "url": "/assets/platform-mesh-portal-ui-wc.js#generic-detail-view",
